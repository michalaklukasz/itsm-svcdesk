# ai-generated: 80% - drafted with Copilot and checked against the Lab 4 spec and recorded baseline.
# Symptom alerts for the shop; windows account for the one-minute OTLP metric export.
groups:
  - name: shop-checkout-symptoms
    rules:
      - alert: ShopCheckoutErrors
        expr: |
          (
            sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
            /
            sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m]))
          ) > 0.05
        for: 1m
        labels:
          service: checkout
          cluster: shop
          severity: P1
        annotations:
          summary: "Checkout server requests are failing above the 5% threshold"

      - alert: ShopCheckoutLatency
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(traces_span_metrics_duration_milliseconds_bucket{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m])
            )
          ) > 2000
        for: 1m
        labels:
          service: checkout
          cluster: shop
          severity: P1
        annotations:
          summary: "Checkout server p99 latency exceeds 2 seconds"

      - alert: ShopCheckoutLatencyWarning
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(traces_span_metrics_duration_milliseconds_bucket{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m])
            )
          ) > 500
        for: 1m
        labels:
          service: checkout
          cluster: shop
          severity: P2
        annotations:
          summary: "Checkout server p95 latency is elevated"
